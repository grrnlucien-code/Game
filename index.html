<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attrape les étoiles</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1026; color: #fff; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { background: linear-gradient(#141a3a, #0b1026); border-radius: 12px; max-width: 100vw; touch-action: none; }
  #info { font-size: 14px; opacity: .8; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<canvas id="jeu" width="400" height="560"></canvas>
<div id="info">← → ou souris / doigt pour bouger le panier. Attrape les ⭐, évite les 💣 !</div>
<script>
const canvas = document.getElementById('jeu');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let panier, objets, score, vies, record = 0, enJeu = false, timer, vitesse;
const touches = {};

function demarrer() {
  panier = { x: W / 2, w: 70, h: 18 };
  objets = [];
  score = 0; vies = 3; timer = 0; vitesse = 2;
  enJeu = true;
}

function ajouterObjet() {
  const bombe = Math.random() < 0.25;
  objets.push({ x: 20 + Math.random() * (W - 40), y: -20, bombe, v: vitesse + Math.random() * 1.5 });
}

function mettreAJour() {
  if (!enJeu) return;
  if (touches.ArrowLeft) panier.x -= 7;
  if (touches.ArrowRight) panier.x += 7;
  panier.x = Math.max(panier.w / 2, Math.min(W - panier.w / 2, panier.x));

  timer++;
  if (timer % Math.max(20, 50 - Math.floor(score / 5)) === 0) ajouterObjet();
  vitesse = 2 + score / 15;

  const haut = H - 40;
  for (let i = objets.length - 1; i >= 0; i--) {
    const o = objets[i];
    o.y += o.v;
    const attrape = o.y > haut - 10 && o.y < haut + panier.h && Math.abs(o.x - panier.x) < panier.w / 2 + 10;
    if (attrape) {
      if (o.bombe) vies--; else score++;
      objets.splice(i, 1);
    } else if (o.y > H + 20) {
      if (!o.bombe) vies--;
      objets.splice(i, 1);
    }
  }
  if (vies <= 0) { enJeu = false; record = Math.max(record, score); }
}

function dessiner() {
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (panier) {
    ctx.font = '26px serif';
    for (const o of objets) ctx.fillText(o.bombe ? '💣' : '⭐', o.x, o.y);
    ctx.fillStyle = '#ffb347';
    ctx.fillRect(panier.x - panier.w / 2, H - 40, panier.w, panier.h);

    ctx.font = 'bold 18px system-ui';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.fillText('Score : ' + score, 12, 20);
    ctx.textAlign = 'right';
    ctx.fillText('❤️'.repeat(Math.max(0, vies)), W - 12, 20);
    ctx.textAlign = 'center';
  }

  if (!enJeu) {
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px system-ui';
    ctx.fillText(panier ? 'Perdu !' : 'Attrape les étoiles', W / 2, H / 2 - 40);
    ctx.font = '18px system-ui';
    if (panier) ctx.fillText('Score : ' + score + '   Record : ' + record, W / 2, H / 2);
    ctx.fillText('Clique ou appuie sur Espace pour jouer', W / 2, H / 2 + 40);
  }
}

function boucle() { mettreAJour(); dessiner(); requestAnimationFrame(boucle); }

document.addEventListener('keydown', e => {
  touches[e.key] = true;
  if (e.key === ' ' && !enJeu) { e.preventDefault(); demarrer(); }
});
document.addEventListener('keyup', e => { touches[e.key] = false; });

function suivrePointeur(e) {
  if (!panier) return;
  const r = canvas.getBoundingClientRect();
  panier.x = (e.clientX - r.left) * (W / r.width);
}
canvas.addEventListener('pointermove', suivrePointeur);
canvas.addEventListener('pointerdown', e => { if (!enJeu) demarrer(); else suivrePointeur(e); });

boucle();
</script>
</body>
</html>
